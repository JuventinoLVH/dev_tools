# Temux-resurrect
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh psql mysql'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Missellaneous settings
set -g mouse on
unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix
set -g status-style bg=default,fg=default

set -g status-left-length 60
set -g status-left '#[fg=colour244]#S:#P | ' 
set -g status-right-length '#H'
set -g window-status-format "#[fg=colour244]#I:#W"
set -g window-status-current-format "(#I:#W)"

setw -g mode-keys vi
set -g status-keys vi
set-option -g status-position top


# swamp down/up/ with alt + q/e
bind -n M-e swap-pane -D                                # alt + e
bind -n M-q swap-pane -U                                # alt + q
bind -n M-j swap-pane -D                                # alt + q
bind -n M-k swap-pane -U                                # alt + q

# Easier pane navigation with Vim keys.
#ind -n M-h select-pane -L                              # alt + h
#ind -n M-j select-pane -D                              # alt + j
#ind -n M-k select-pane -U                              # alt + k
#ind -n M-l select-pane -R                              # alt + l

# Resize panes with prefix + H/J/K/L.
bind -n M-H resize-pane -L 1                            # alt + H
bind -n M-J resize-pane -D 1                            # alt + J
bind -n M-K resize-pane -U 1                            # alt + K
bind -n M-L resize-pane -R 1                            # alt + L

# Split panes 
bind -n M-v split-window -h -c "#{pane_current_path}"   # alt + v
bind -n M-s split-window -v -c "#{pane_current_path}"   # alt + s
# Create a new window in the current directory.
bind -n M-n new-window -c "#{pane_current_path}"        # alt + n

# Other useful bindings.
bind -n M-x kill-pane                                   # alt + x
bind -n M-X kill-window                                 # alt + X
bind -n M-y copy-mode -e                                # alt + y
bind -n M-c display-panes -d 1000                       # alt + c
bind -n M-f resize-pane -Z                              # alt + f
bind -n M-d detach-client                               # alt + d
                                        
bind -n M-Space next-layout                             # alt + spacebar 
bind -n M-C-Space previous-layout                       # alt + shift + spacebar 
                                                        # alt + W
                                                        # alt + S
bind -n M-W command-prompt -I '#W' { rename-window -- '%%' }
bind -n M-S command-prompt -I '#S' { rename-session -- '%%' }
#bind -n M-r command-prompt -I "#W" "rename window '%%'" # alt + r
#bind -n M-p command-prompt -I "#P" "rename pane '%%'"   # alt + p


# Move between windows                                  # alt + w
bind -n M-w choose-tree "select-window -t '%%'" 
bind -n M-C-h previous-window                           # alt + ctrl + h
bind -n M-C-l next-window                               # alt + ctrl + l
bind -n M-0 select-window -t :0                         # alt + 0 
bind -n M-1 select-window -t :1                         # alt + 1
bind -n M-2 select-window -t :2                         # alt + 2 
bind -n M-3 select-window -t :3                         # alt + 3
bind -n M-4 select-window -t :4                         # alt + 4 
bind -n M-5 select-window -t :5                         # alt + 5
bind -n M-6 select-window -t :6                         # alt + 6 
bind -n M-7 select-window -t :7                         # alt + 7
bind -n M-8 select-window -t :8                         # alt + 8 
bind -n M-9 select-window -t :9                         # alt + 9


############
# bullsith #
############
# Reload this configuration.                            # alt + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"


# Start new windows in the current pane's directory.
set -g default-command "${SHELL}"
set -g default-shell "${SHELL}"
set -g status-justify left

# Use a reasonable terminal type and colors.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -s escape-time -0

run '~/.config/tmux/plugins/tpm/tpm'
